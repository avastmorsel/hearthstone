  <!-- Home screen icon: iOS requires a real PNG — generated via canvas at runtime -->

  <script>
    (function () {
      const S = 180, R = 40;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const x = c.getContext('2d');
      // Rounded dark background
      x.beginPath();
      x.moveTo(R,0); x.lineTo(S-R,0); x.quadraticCurveTo(S,0,S,R);
      x.lineTo(S,S-R); x.quadraticCurveTo(S,S,S-R,S);
      x.lineTo(R,S); x.quadraticCurveTo(0,S,0,S-R);
      x.lineTo(0,R); x.quadraticCurveTo(0,0,R,0);
      x.closePath();
      x.fillStyle = '#2A1F0F';
      x.fill();
      // Outer flame — gold teardrop
      x.beginPath();
      x.moveTo(90,22);
      x.bezierCurveTo(90,22, 45,72, 45,112);
      x.bezierCurveTo(45,140, 65,158, 90,158);
      x.bezierCurveTo(115,158, 135,140, 135,112);
      x.bezierCurveTo(135,72, 90,22, 90,22);
      x.closePath();
      x.fillStyle = '#C49A3C';
      x.fill();
      // Inner highlight
      x.beginPath();
      x.moveTo(90,72);
      x.bezierCurveTo(90,72, 68,100, 68,120);
      x.bezierCurveTo(68,135, 78,146, 90,146);
      x.bezierCurveTo(102,146, 112,135, 112,120);
      x.bezierCurveTo(112,100, 90,72, 90,72);
      x.closePath();
      x.fillStyle = '#F0C060';
      x.fill();
      document.getElementById('appleTouchIcon').href = c.toDataURL('image/png');
    })();
  </script>

    /* ── Reset ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { cursor: pointer; }

    /* ── Variables ─────────────────────────── */
    :root {
      --cream:       #F7F2E8;
      --parchment:   #EDE5D0;
      --card:        #FDFAF3;
      --ink:         #2A1F0F;
      --warm-gray:   #7A6A52;
      --border:      #D9CEBC;
      --terracotta:  #B85C3A;
      --terra-light: #D4826A;
      --sage:        #5C7A60;
      --sage-light:  #A8C5AB;
      --gold:        #C49A3C;
      --gold-dark:   #A07A2A;
      --sky:         #4A8BA8;
      --ff-display:  'Playfair Display', Georgia, serif;
      --ff-body:     'Lora', Georgia, serif;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── Base ──────────────────────────────── */
    html { height: 100%; background: var(--cream); }
    body {
      height: 100%;
      font-family: var(--ff-body);
      font-size: 16px;
      color: var(--ink);
      background: var(--cream);
      overflow: hidden;
    }

    /* ── App Shell ─────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Header ────────────────────────────── */
    header {
      background: var(--ink);
      padding: calc(12px + var(--safe-top)) 18px 10px;
      flex-shrink: 0;
      position: relative;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .wordmark-title {
      font-family: var(--ff-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    .wordmark-sub {
      font-family: var(--ff-body);
      font-size: 0.74rem;
      color: var(--parchment);
      opacity: 0.55;
      font-style: italic;
      letter-spacing: 0.06em;
      margin-top: 1px;
    }

    .sync-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      margin-left: 7px;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .sync-dot.on {
      opacity: 0.9;
      animation: syncPulse 1s ease-in-out infinite;
    }
    @keyframes syncPulse {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 0.9; }
    }

    /* Month navigator */
    .month-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 5px 8px;
    }

    .month-nav button {
      background: none;
      border: none;
      color: var(--parchment);
      font-size: 1.1rem;
      padding: 2px 6px;
      opacity: 0.65;
      transition: opacity 0.15s;
      line-height: 1;
    }

    .month-nav button:hover { opacity: 1; }

    #monthLabel {
      font-family: var(--ff-display);
      font-size: 0.82rem;
      color: var(--cream);
      min-width: 108px;
      text-align: center;
      font-style: italic;
    }

    /* ── Bottom Nav ────────────────────────── */
    nav {
      display: flex;
      background: var(--ink);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-bottom: var(--safe-bottom);
      flex-shrink: 0;
    }

    nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--parchment);
      opacity: 0.45;
      padding: 9px 4px 7px;
      font-family: var(--ff-body);
      font-size: 0.7rem;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: opacity 0.15s, color 0.15s;
    }

    nav button svg { width: 20px; height: 20px; }

    nav button.active {
      opacity: 1;
      color: var(--gold);
    }

    /* ── Main ──────────────────────────────── */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 14px 20px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Cards & Panels ────────────────────── */
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    /* ── Summary Banner ────────────────────── */
    .summary-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
    }

    .stat { text-align: center; }

    .stat-val {
      font-family: var(--ff-display);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-lbl {
      font-size: 0.67rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--warm-gray);
      margin-top: 3px;
    }

    .stat-divider {
      width: 1px;
      height: 32px;
      background: var(--border);
    }

    /* ── Chart ─────────────────────────────── */
    .chart-inner {
      padding: 14px 16px;
    }

    .panel-label {
      font-family: var(--ff-display);
      font-size: 0.78rem;
      font-style: italic;
      color: var(--warm-gray);
      margin-bottom: 12px;
    }

    .chart-wrap {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    #pieChart { flex-shrink: 0; }

    .chart-legend {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      color: var(--warm-gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Category Cards ────────────────────── */
    .section-eyebrow {
      font-family: var(--ff-display);
      font-size: 0.7rem;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--warm-gray);
      margin: 4px 2px 8px;
    }

    .cat-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }

    .cat-card:last-child { border-bottom: none; border-radius: 0 0 12px 12px; }
    .cat-card:first-child { border-radius: 12px 12px 0 0; }
    .cat-card:only-child  { border-radius: 12px; }
    .cat-card:active { background: var(--parchment); }

    .cat-icon { width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .cat-icon svg { width: 36px; height: 36px; }

    .cat-body { flex: 1; min-width: 0; }

    .cat-name {
      font-family: var(--ff-display);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .cat-amounts {
      font-size: 0.74rem;
      color: var(--warm-gray);
      margin-bottom: 5px;
    }

    .progress-track {
      height: 4px;
      background: var(--parchment);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.7s cubic-bezier(.4,0,.2,1);
    }

    .fill-ok      { background: var(--sage); }
    .fill-warn    { background: var(--gold); }
    .fill-over    { background: var(--terracotta); }

    .cat-pct {
      font-family: var(--ff-display);
      font-size: 0.78rem;
      font-weight: 700;
      min-width: 34px;
      text-align: right;
    }

    .pct-ok   { color: var(--sage); }
    .pct-warn { color: var(--gold); }
    .pct-over { color: var(--terracotta); }

    /* ── Add Form ──────────────────────────── */
    .form-title {
      font-family: var(--ff-display);
      font-size: 1.15rem;
      font-style: italic;
      padding: 16px 18px 0;
    }

    .form-body { padding: 14px 18px 18px; }

    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--warm-gray);
      margin-bottom: 5px;
    }

    input[type="number"],
    input[type="date"],
    input[type="text"],
    select {
      width: 100%;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      font-family: var(--ff-body);
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    input:focus, select:focus { border-color: var(--terracotta); }

    .amount-wrap { position: relative; }
    .amount-wrap::before {
      content: '$';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--warm-gray);
      font-family: var(--ff-display);
      pointer-events: none;
    }
    .amount-wrap input { padding-left: 22px; }

    /* Category picker grid */
    .cat-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .pick-btn {
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.67rem;
      color: var(--warm-gray);
      font-family: var(--ff-body);
      text-align: center;
      line-height: 1.2;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }

    .pick-btn svg { width: 26px; height: 26px; }

    .pick-btn.selected {
      border-color: var(--terracotta);
      background: rgba(184,92,58,0.06);
      color: var(--terracotta);
    }

    .btn-submit {
      width: 100%;
      background: var(--terracotta);
      color: var(--cream);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-family: var(--ff-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: background 0.15s;
    }

    .btn-submit:hover { background: var(--terra-light); }
    .btn-submit:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── History ───────────────────────────── */
    .expense-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--border);
    }

    .expense-item:last-child { border-bottom: none; }

    .exp-icon { width: 30px; height: 30px; flex-shrink: 0; }
    .exp-icon svg { width: 30px; height: 30px; }

    .exp-body { flex: 1; min-width: 0; }

    .exp-cat {
      font-family: var(--ff-display);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .exp-desc {
      font-size: 0.78rem;
      color: var(--warm-gray);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .exp-date {
      font-size: 0.64rem;
      color: var(--warm-gray);
      opacity: 0.65;
    }

    .exp-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
    }

    .exp-amount {
      font-family: var(--ff-display);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .btn-remove {
      background: none;
      border: 1px solid transparent;
      color: var(--warm-gray);
      font-size: 0.64rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--ff-body);
      opacity: 0.5;
      transition: all 0.15s;
    }

    .btn-remove:hover {
      opacity: 1;
      color: var(--terracotta);
      border-color: var(--terracotta);
    }

    /* ── Summary Report ────────────────────── */
    .report-header {
      background: var(--ink);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 12px;
    }

    .report-month {
      font-family: var(--ff-display);
      font-size: 1.35rem;
      font-style: italic;
      color: var(--gold);
    }

    .report-sub {
      font-size: 0.68rem;
      color: var(--parchment);
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }

    .report-stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 14px;
    }

    .rstat-val {
      font-family: var(--ff-display);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--cream);
    }

    .rstat-lbl {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--parchment);
      opacity: 0.55;
      margin-top: 2px;
    }

    .report-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border-bottom: 1px solid var(--border);
    }

    .report-row:last-child { border-bottom: none; }

    .rrow-icon { width: 24px; height: 24px; flex-shrink: 0; }
    .rrow-icon svg { width: 24px; height: 24px; }

    .rrow-name {
      flex: 1;
      font-family: var(--ff-display);
      font-size: 0.82rem;
    }

    .rrow-budget {
      font-size: 0.7rem;
      color: var(--warm-gray);
      min-width: 52px;
      text-align: right;
    }

    .rrow-spent {
      font-family: var(--ff-display);
      font-size: 0.88rem;
      font-weight: 700;
      min-width: 58px;
      text-align: right;
    }

    .rrow-ok   { color: var(--sage); }
    .rrow-over { color: var(--terracotta); }

    /* ── Utility States ────────────────────── */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--warm-gray);
      font-style: italic;
      gap: 12px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--terracotta);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--warm-gray);
      font-style: italic;
      line-height: 1.7;
    }

    /* ── Toast ─────────────────────────────── */
    #toast {
      position: fixed;
      bottom: calc(66px + var(--safe-bottom) + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--ink);
      color: var(--cream);
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-family: var(--ff-body);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 999;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Ornament ──────────────────────────── */
    .ornament {
      text-align: center;
      color: var(--gold);
      letter-spacing: 0.4em;
      font-size: 0.75rem;
      opacity: 0.55;
      margin: 10px 0 4px;
    }

    /* ── Period toggle (Month / YTD) ───────── */
    .period-toggle {
      display: flex;
      background: var(--parchment);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      margin-bottom: 12px;
    }
    .period-toggle button {
      flex: 1;
      background: none;
      border: none;
      padding: 8px;
      font-family: var(--ff-display);
      font-size: 0.82rem;
      color: var(--warm-gray);
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .period-toggle button.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    /* ── Alerts ────────────────────────────── */
    .alert-panel {
      border-color: rgba(184,92,58,0.35);
      background: linear-gradient(180deg, rgba(184,92,58,0.05), var(--card));
    }
    .alert-head {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 11px 14px 8px;
      font-family: var(--ff-display);
      font-size: 0.82rem;
      font-style: italic;
      color: var(--terracotta);
    }
    .alert-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
    }
    .alert-icon { width: 26px; height: 26px; flex-shrink: 0; }
    .alert-icon svg { width: 26px; height: 26px; }
    .alert-text { flex: 1; display: flex; flex-direction: column; }
    .alert-cat { font-family: var(--ff-display); font-size: 0.85rem; font-weight: 700; }
    .alert-detail { font-size: 0.7rem; color: var(--warm-gray); }
    .alert-tag {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 7px;
      border-radius: 10px;
      font-weight: 700;
      background: rgba(184,92,58,0.15);
      color: var(--terracotta);
    }

    /* ── Recurring switch (Log form) ───────── */
    .recurring-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .recurring-label { display: flex; flex-direction: column; gap: 2px; }
    .recurring-title { font-family: var(--ff-display); font-size: 0.9rem; font-weight: 700; }
    .recurring-hint { font-size: 0.68rem; color: var(--warm-gray); }
    .switch {
      width: 44px; height: 26px;
      background: var(--border);
      border-radius: 13px;
      flex-shrink: 0;
      position: relative;
      transition: background 0.2s;
    }
    .switch.on { background: var(--sage); }
    .switch-knob {
      position: absolute;
      top: 3px; left: 3px;
      width: 20px; height: 20px;
      background: var(--card);
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
      transition: left 0.2s;
    }
    .switch.on .switch-knob { left: 21px; }

    /* ── Recurring badge ───────────────────── */
    .recur-badge {
      display: inline-block;
      font-family: var(--ff-body);
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sage);
      background: rgba(92,122,96,0.12);
      padding: 1px 6px;
      border-radius: 8px;
      margin-left: 6px;
      vertical-align: middle;
      font-weight: 400;
    }

    /* ── Filter bar (Ledger) ───────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .filter-search {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-family: var(--ff-body);
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      -webkit-appearance: none;
    }
    .filter-search:focus { border-color: var(--terracotta); }
    .filter-cat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-family: var(--ff-body);
      font-size: 0.82rem;
      color: var(--ink);
      outline: none;
      max-width: 42%;
      -webkit-appearance: none;
    }
    .filter-cat:focus { border-color: var(--terracotta); }

    /* ── Monthly note ──────────────────────── */
    .note-panel { padding: 14px; }
    .note-input {
      width: 100%;
      min-height: 64px;
      background: var(--cream);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--ff-body);
      font-size: 0.92rem;
      color: var(--ink);
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }
    .note-input:focus { border-color: var(--terracotta); }
    .note-save {
      margin-top: 8px;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 7px;
      padding: 8px 16px;
      font-family: var(--ff-display);
      font-size: 0.82rem;
      font-weight: 700;
    }
    .note-save:disabled { opacity: 0.5; }

    /* ── Comparison & averages rows ────────── */
    .cmp-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border-bottom: 1px solid var(--border);
    }
    .cmp-row:last-child { border-bottom: none; }
    .cmp-name {
      flex: 1;
      font-family: var(--ff-display);
      font-size: 0.82rem;
    }
    .cmp-now {
      font-family: var(--ff-display);
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 54px;
      text-align: right;
    }
    .cmp-delta {
      font-size: 0.72rem;
      min-width: 64px;
      text-align: right;
      font-weight: 600;
    }
    .cmp-up   { color: var(--terracotta); }
    .cmp-down { color: var(--sage); }
    .cmp-flat { color: var(--warm-gray); opacity: 0.6; }

    .avg-val {
      font-family: var(--ff-display);
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 76px;
      text-align: right;
    }
    .avg-permo {
      font-family: var(--ff-body);
      font-size: 0.6rem;
      font-weight: 400;
      color: var(--warm-gray);
      margin-left: 2px;
    }
    .avg-note { min-width: 72px; text-align: right; font-size: 0.68rem; }
    .avg-over  { color: var(--terracotta); }
    .avg-under { color: var(--sage); }

    /* Average window toggle */
    .avg-toggle {
      display: inline-flex;
      gap: 2px;
      background: var(--parchment);
      border-radius: 7px;
      padding: 2px;
    }
    .avg-toggle button {
      background: none;
      border: none;
      padding: 4px 9px;
      font-family: var(--ff-body);
      font-size: 0.66rem;
      color: var(--warm-gray);
      border-radius: 5px;
      text-transform: none;
      letter-spacing: 0;
    }
    .avg-toggle button.active {
      background: var(--card);
      color: var(--ink);
      font-weight: 600;
    }
  </style>
</head>

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const state = {
  view:       'dashboard',
  month:      currentYM(),
  period:     'month',   // 'month' | 'ytd'
  budget:     [],
  allExpenses: [],        // every expense, fetched once
  notes:      {},         // { 'YYYY-MM': 'note text' }
  selCat:     null,
  recurring:  false,      // add-form recurring toggle
  filterText: '',         // ledger search
  filterCat:  '',         // ledger category filter
  avgWindow:  3,          // 3 | 6 | 12 months
};

function currentYM() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function fmtMonth(ym) {
  const [y, m] = ym.split('-');
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  return `${MONTHS[parseInt(m)-1]} ${y}`;
}

function fmtMonthShort(ym) {
  const [y, m] = ym.split('-');
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${MONTHS[parseInt(m)-1]} ${y.slice(2)}`;
}

function fmtCur(n) {
  const v = parseFloat(n||0);
  return '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}

function fmtCur0(n) {
  const v = Math.round(parseFloat(n||0));
  return '$' + v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
}

function catId(name) { return CAT_ID[name] || 'household'; }

// Escape user-supplied text before inserting into innerHTML
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── Date / period helpers ─────────────────────────────────
function ymOf(e) { return String(e.Month).substring(0,7); }

function monthExpenses(ym) {
  return state.allExpenses.filter(e => ymOf(e) === ym);
}

// Year-to-date: all expenses in the same year, up to & including the selected month
function ytdExpenses(ym) {
  const year = ym.split('-')[0];
  return state.allExpenses.filter(e => {
    const m = ymOf(e);
    return m.startsWith(year + '-') && m <= ym;
  });
}

// Expenses for the currently selected period (month or ytd)
function periodExpenses() {
  return state.period === 'ytd' ? ytdExpenses(state.month) : monthExpenses(state.month);
}

// How many months the YTD window covers (Jan..selected)
function ytdMonthCount(ym) { return parseInt(ym.split('-')[1], 10); }

// Budget for a category over the selected period
function periodBudget(monthlyBudget) {
  return state.period === 'ytd'
    ? parseFloat(monthlyBudget||0) * ytdMonthCount(state.month)
    : parseFloat(monthlyBudget||0);
}

function prevMonthOf(ym) {
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

// The N month-keys ending at (and including) ym, oldest first
function lastNMonths(ym, n) {
  const out = [];
  let [y,m] = ym.split('-').map(Number);
  for (let i = 0; i < n; i++) {
    out.unshift(`${y}-${String(m).padStart(2,'0')}`);
    m--; if (m < 1) { m = 12; y--; }
  }
  return out;
}

function spendMapFor(expenses) {
  const map = {};
  expenses.forEach(e => { map[e.Category] = (map[e.Category]||0) + parseFloat(e.Amount||0); });
  return map;
}

// Average monthly spend for a category across the avg window.
// Denominator is the number of window-months that fall at or after the
// earliest tracked month, so short history doesn't understate the average.
function avgForCat(cat) {
  const months = lastNMonths(state.month, state.avgWindow);
  if (!state.allExpenses.length) return 0;
  const earliest = state.allExpenses.reduce((min, e) => {
    const m = ymOf(e); return m < min ? m : min;
  }, '9999-99');
  const valid = months.filter(m => m >= earliest);
  const denom = valid.length || 1;
  let total = 0;
  state.allExpenses.forEach(e => {
    if (e.Category === cat && valid.includes(ymOf(e))) total += parseFloat(e.Amount||0);
  });
  return total / denom;
}

// Categories that have gone over budget this month
function computeAlerts() {
  const map = spendMapFor(monthExpenses(state.month));
  return state.budget
    .filter(b => b.BillingType !== 'quarterly')
    .filter(b => {
      const budget = parseFloat(b.MonthlyBudget||0);
      return budget > 0 && (map[b.Category]||0) > budget;
    })
    .map(b => ({
      cat: b.Category,
      spent: map[b.Category],
      budget: parseFloat(b.MonthlyBudget)
    }));
}

// ══════════════════════════════════════════════════════════
//  API — JSONP bypasses cross-origin policy without a proxy
// ══════════════════════════════════════════════════════════
function api(params) {
  return new Promise((resolve, reject) => {
    const cb = 'hs_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const url = new URL(SCRIPT_URL);
    Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, String(v)));
    url.searchParams.set('callback', cb);

    const script = document.createElement('script');
    const timer  = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 30000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cb] = function(data) { cleanup(); resolve(data); };
    script.onerror = function() { cleanup(); reject(new Error('load failed')); };
    script.src = url.toString();
    document.head.appendChild(script);
  });
}

// ── Local cache (instant open + offline resilience) ───────
const CACHE_KEY = 'hearthstone_cache_v2';

function readCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e) { return null; }
}
function writeCache() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      budget: state.budget, allExpenses: state.allExpenses, notes: state.notes, ts: Date.now()
    }));
  } catch(e) { /* storage full or unavailable — non-fatal */ }
}
function setSyncing(on) {
  const dot = document.getElementById('syncDot');
  if (dot) dot.classList.toggle('on', !!on);
}

// Stale-while-revalidate: paint cached data immediately, then refresh.
async function loadAll() {
  const cached = readCache();
  if (cached && cached.budget && cached.budget.length) {
    state.budget      = cached.budget;
    state.allExpenses = cached.allExpenses || [];
    state.notes       = cached.notes || {};
    render();                 // instant paint from cache
  } else {
    showLoading();
  }

  setSyncing(true);
  try {
    const res = await api({ action: 'getAll' });   // one round trip
    if (res && res.data) {
      state.budget      = res.data.budget   || [];
      state.allExpenses = res.data.expenses || [];
      state.notes       = res.data.notes    || {};
      writeCache();
      if (state.view !== 'add') render();   // don't clobber a form in progress
    }
  } catch(e) {
    if (!cached) toast('Could not reach the ledger. Check your connection.');
    // with a cache present we stay usable offline and refresh silently next time
  }
  setSyncing(false);
}

function drawPie(spendMap, totalBudget, totalSpent) {
  const canvas = document.getElementById('pieChart');
  if (!canvas || !state.budget.length) return;
  const ctx = canvas.getContext('2d');
  // Sharpen on high-DPI screens: scale the backing store, keep CSS size at 130
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = '130px';
  canvas.style.height = '130px';
  canvas.width  = 130 * dpr;
  canvas.height = 130 * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = 65, cy = 65, R = 56, hole = 28;

  const slices = state.budget.map((b,i) => ({
    name:   b.Category,
    budget: parseFloat(b.MonthlyBudget||0),
    color:  PIE_PALETTE[i % PIE_PALETTE.length],
  })).filter(s => s.budget > 0);

  const total = slices.reduce((s,sl) => s + sl.budget, 0);
  if (!total) return;

  let angle = -Math.PI / 2;
  slices.forEach(sl => {
    const sweep = (sl.budget / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, angle, angle + sweep);
    ctx.closePath();
    ctx.fillStyle = sl.color;
    ctx.fill();
    ctx.strokeStyle = '#F7F2E8';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    angle += sweep;
  });

  // Donut hole
  ctx.beginPath();
  ctx.arc(cx, cy, hole, 0, Math.PI * 2);
  ctx.fillStyle = '#FDFAF3';
  ctx.fill();

  // Center text
  const pct = totalBudget > 0 ? Math.round((totalSpent / totalBudget) * 100) : 0;
  ctx.fillStyle   = '#2A1F0F';
  ctx.font        = `bold 15px 'Playfair Display', Georgia, serif`;
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${pct}%`, cx, cy - 5);
  ctx.font        = `9px 'Lora', Georgia, serif`;
  ctx.fillStyle   = '#7A6A52';
  ctx.fillText('spent', cx, cy + 9);

  // Legend
  const legend = document.getElementById('legend');
  if (legend) {
    legend.innerHTML = slices.slice(0,9).map(sl => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${sl.color}"></div>
        <span>${sl.name}</span>
      </div>`).join('');
  }
}

function renderCatList(spendMap) {
  const list = document.getElementById('catList');
  if (!list) return;
  list.innerHTML = state.budget.map(b => {
    const budget = periodBudget(b.MonthlyBudget);
    const spent  = spendMap[b.Category] || 0;
    const raw    = budget > 0 ? (spent / budget) * 100 : 0;
    const pct    = Math.min(raw, 100);
    const over   = raw > 100;
    const warn   = raw >= 80 && !over;
    const cls    = over ? 'over' : warn ? 'warn' : 'ok';
    const icon   = ICONS[catId(b.Category)] || ICONS.household;
    const qBadge = b.BillingType === 'quarterly'
      ? `<span style="font-size:0.6rem;opacity:0.55;font-style:italic"> · quarterly</span>` : '';
    return `
      <div class="cat-card" data-cat="${b.Category}">
        <div class="cat-icon">${icon}</div>
        <div class="cat-body">
          <div class="cat-name">${b.Category}</div>
          <div class="cat-amounts">${fmtCur(spent)} of ${fmtCur(budget)}${qBadge}</div>
          <div class="progress-track">
            <div class="progress-fill fill-${cls}" style="width:${pct}%"></div>
          </div>
        </div>
        <div class="cat-pct pct-${cls}">${over?'+':''}${Math.round(raw)||0}%</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.cat-card').forEach(card => {
    card.addEventListener('click', () => {
      state.selCat = card.dataset.cat;
      switchView('add');

  });
}

function renderAdd() {
  const today = new Date().toISOString().split('T')[0];

  main.innerHTML = `
    <div class="panel">
      <div class="form-title">Log an Expense</div>
      <div class="form-body">

          </div>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="fDate" value="${today}">
        </div>
        <div class="form-group">
          <label>Description <span style="opacity:0.5;font-size:0.8em">(optional)</span></label>
          <input type="text" id="fDesc" placeholder="What was this for?">
        </div>
        <div class="recurring-row" id="recurRow">
          <div class="recurring-label">
            <span class="recurring-title">Recurring expense</span>
            <span class="recurring-hint">A predictable bill you expect each month</span>
          </div>
          <div class="switch" id="recurSwitch"><div class="switch-knob"></div></div>
        </div>
        <button class="btn-submit" id="fSubmit">Record in the Ledger</button>
      </div>
    </div>`;

  let chosen = state.selCat || '';
  const picker = document.getElementById('picker');
  picker.innerHTML = state.budget.map(b => {
    const icon = ICONS[catId(b.Category)] || ICONS.household;
    return `<button class="pick-btn${b.Category===chosen?' selected':''}" data-cat="${b.Category}">${icon}${b.Category}</button>`;
  }).join('');

  picker.querySelectorAll('.pick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      picker.querySelectorAll('.pick-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      chosen = btn.dataset.cat;
    });
  });

  // Recurring toggle
  const sw = document.getElementById('recurSwitch');
  document.getElementById('recurRow').addEventListener('click', () => {
    state.recurring = !state.recurring;
    sw.classList.toggle('on', state.recurring);
  });

  document.getElementById('fSubmit').addEventListener('click', () => {
    const amount = parseFloat(document.getElementById('fAmount').value);
    const date   = document.getElementById('fDate').value;
    const desc   = document.getElementById('fDesc').value.trim();

    if (!chosen)       { toast('Choose a category first.'); return; }
    if (!amount || amount <= 0) { toast('Enter a valid amount.'); return; }
    if (!date)         { toast('Choose a date.'); return; }

    // Optimistic: add locally and move on immediately
    const rec = {
      ID: 'tmp_' + Date.now(),
      Date: date,
      Category: chosen,
      Amount: amount,
      Description: desc,
      Month: date.substring(0, 7),
      Recurring: state.recurring,
    };
    state.allExpenses.push(rec);
    writeCache();
    state.selCat = null;
    toast('Logged to the ledger.');
    switchView('dashboard');

    // Confirm with the server in the background
    api({ action:'addExpense', category:chosen, amount, date, description:desc, recurring: rec.Recurring })
      .then(res => { if (res && res.id) { rec.ID = res.id; writeCache(); } })
      .catch(() => {
        const i = state.allExpenses.indexOf(rec);
        if (i >= 0) state.allExpenses.splice(i, 1);
        writeCache();
        toast('Could not save that entry — please retry.');
        render();
      });
  });
}

// ── History ───────────────────────────────────────────────
function renderHistory() {
  const monthExp = monthExpenses(state.month);

  // Category options present this month
  const presentCats = [...new Set(monthExp.map(e => e.Category))];

  // Apply filters
  let filtered = monthExp.filter(e => {
    if (state.filterCat && e.Category !== state.filterCat) return false;
    if (state.filterText) {
      const t = state.filterText.toLowerCase();
      const hay = `${e.Category} ${e.Description||''}`.toLowerCase();
      if (!hay.includes(t)) return false;
    }
    return true;
  });
  filtered.sort((a,b) => new Date(b.Date) - new Date(a.Date));

  const filterBar = `
    <div class="filter-bar">
      <input type="text" id="fSearch" class="filter-search" placeholder="Search descriptions…" value="${esc(state.filterText)}">
      <select id="fCat" class="filter-cat">
        <option value="">All categories</option>
        ${presentCats.map(c => `<option value="${c}"${c===state.filterCat?' selected':''}>${c}</option>`).join('')}
      </select>
    </div>`;

  if (!monthExp.length) {
    main.innerHTML = filterBar + `<div class="empty-state">No entries yet for ${fmtMonth(state.month)}.<br><br>
      <span style="font-size:0.8rem">The larder is empty — which is either very good<br>or very concerning.</span></div>`;
    wireFilters();
    return;
  }

  const total = filtered.reduce((s,e) => s + parseFloat(e.Amount||0), 0);

  main.innerHTML = filterBar + `
    <div class="section-eyebrow">${filtered.length} of ${monthExp.length} · ${fmtCur(total)} shown</div>
    <div class="panel">
      ${filtered.length ? filtered.map(e => {
        const icon = ICONS[catId(e.Category)] || ICONS.household;
        const d    = new Date(e.Date + 'T12:00:00');
        const ds   = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
        const rec  = e.Recurring ? `<span class="recur-badge">recurring</span>` : '';
        return `
          <div class="expense-item">
            <div class="exp-icon">${icon}</div>
            <div class="exp-body">
              <div class="exp-cat">${e.Category}${rec}</div>
              <div class="exp-desc">${e.Description ? esc(e.Description) : '—'}</div>
              <div class="exp-date">${ds}</div>
            </div>
            <div class="exp-right">
              <div class="exp-amount">${fmtCur(e.Amount)}</div>
              <button class="btn-remove" data-id="${e.ID}">remove</button>
            </div>
          </div>`;
      }).join('') : `<div class="empty-state" style="padding:28px">Nothing matches that filter.</div>`}
    </div>`;

  wireFilters();

  main.querySelectorAll('.btn-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Remove this entry from the ledger?')) return;
      const id  = btn.dataset.id;
      const idx = state.allExpenses.findIndex(e => String(e.ID) === String(id));
      const removed = idx >= 0 ? state.allExpenses[idx] : null;
      if (idx >= 0) state.allExpenses.splice(idx, 1);
      writeCache();
      toast('Entry removed.');
      renderHistory();

      api({ action:'deleteExpense', id }).catch(() => {
        if (removed) { state.allExpenses.push(removed); writeCache(); }
        toast('Could not remove — entry restored.');
        renderHistory();
      });
    });
  });
}

function wireFilters() {
  const search = document.getElementById('fSearch');
  const cat    = document.getElementById('fCat');
  if (search) {
    search.addEventListener('input', () => {
      state.filterText = search.value;
      const pos = search.selectionStart;
      renderHistory();
      const s2 = document.getElementById('fSearch');
      if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); }
    });
  }
  if (cat) {
    cat.addEventListener('change', () => {
      state.filterCat = cat.value;
      renderHistory();
    });
  }
}

    </div>
    <div class="panel">
      ${state.budget.map(b => {
        const avg   = avgForCat(b.Category);
        const now   = spendMap[b.Category] || 0;
        const icon  = ICONS[catId(b.Category)] || ICONS.household;
        const vsAvg = now - avg;
        const note  = Math.abs(vsAvg) < 0.5 ? '' :
          (vsAvg > 0 ? `<span class="avg-over">${fmtCur0(vsAvg)} above</span>`
                     : `<span class="avg-under">${fmtCur0(-vsAvg)} below</span>`);
        return `
          <div class="cmp-row">
            <div class="rrow-icon">${icon}</div>
            <div class="cmp-name">${b.Category}</div>
            <div class="avg-val">${fmtCur0(avg)}<span class="avg-permo">/mo avg</span></div>
            <div class="avg-note">${note}</div>
          </div>`;
      }).join('')}
    </div>

    <!-- Budget vs spent table -->
    <div class="section-eyebrow">Budget vs. Spent</div>
    <div class="panel">
      <div class="report-row" style="background:var(--parchment);border-radius:12px 12px 0 0;">
        <div style="width:24px"></div>
        <div style="flex:1;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--warm-gray)">Category</div>
        <div style="min-width:52px;text-align:right;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--warm-gray)">Budget</div>
        <div style="min-width:58px;text-align:right;font-size:0.62rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--warm-gray)">Spent</div>
      </div>
      ${state.budget.map(b => {
        const spent = spendMap[b.Category] || 0;
        const over  = spent > parseFloat(b.MonthlyBudget||0);
        const icon  = ICONS[catId(b.Category)] || ICONS.household;
        return `
          <div class="report-row">
            <div class="rrow-icon">${icon}</div>
            <div class="rrow-name">${b.Category}</div>
            <div class="rrow-budget">${fmtCur(b.MonthlyBudget)}</div>
            <div class="rrow-spent ${over?'rrow-over':'rrow-ok'}">${fmtCur(spent)}</div>
          </div>`;
      }).join('')}
    </div>

    <div class="ornament">— ✦ —</div>
  `;

  // Note save
  // Note save (optimistic)
  document.getElementById('noteSave').addEventListener('click', () => {
    const val = document.getElementById('monthNote').value;
    const btn = document.getElementById('noteSave');
    state.notes[ym] = val;
    writeCache();
    btn.textContent = 'Saved';
    api({ action:'setNote', month: ym, note: val })
      .then(() => { setTimeout(() => { btn.textContent = 'Save note'; }, 1200); })
      .catch(() => { toast('Note saved locally — will sync when back online.'); });
  });

  // Average window toggle
  main.querySelectorAll('.avg-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.avgWindow = parseInt(btn.dataset.w, 10);
      renderSummary();
    });
  });
}

// ══════════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════════
function switchView(v) {
  state.view = v;
  document.querySelectorAll('nav button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === v);
  });
  render();
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});

document.getElementById('prevMonth').addEventListener('click', () => {
  const [y,m] = state.month.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  state.month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('monthLabel').textContent = fmtMonth(state.month);
  render();
});

document.getElementById('nextMonth').addEventListener('click', () => {
  const [y,m] = state.month.split('-').map(Number);
  const d = new Date(y, m, 1);
  state.month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('monthLabel').textContent = fmtMonth(state.month);
  render();
});

document.getElementById('monthLabel').textContent = fmtMonth(state.month);

// ══════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ══════════════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════════════
loadAll();
</script>
</body>
</html>
